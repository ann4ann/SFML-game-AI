name: Build & Test

on:
  push:
    branches: [ "release/**" ]
    paths-ignore:
      - 'assets/**'
      - 'mcp-servers/**'
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
      - '.clinerules'
      - 'LICENSE'
  pull_request:
    branches: [ "**" ]
    paths-ignore:
      - 'assets/**'
      - 'mcp-servers/**'
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
      - '.clinerules'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            libsfml-dev \
            libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: cd build && ctest --output-on-failure